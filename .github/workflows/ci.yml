name: CI

# Kept small for the GitHub Free plan: pull requests only (a merge to main was already checked
# on its PR), one job for everything static, and one desktop Playwright job. Phones and the full
# suite run locally with `npm run check:all`.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      # `npm run check` already ran `tsc -b`; the bundle is all that is left of `npm run build`.
      - run: npx vite build

  # Desktop Chrome only, against its own local backend. Browsers come from Playwright's cache
  # rather than its Docker image, which saves pulling a 2 GB container on every run.
  e2e:
    name: Playwright (desktop)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers and the local Convex backend binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/convex
          key: e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      - run: npx playwright test --project=desktop
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
